appId: local.hanchuang.desktop
productName: 寒窗
executableName: hanchuang
icon: build/icon.png
directories:
  output: dist
electronDist: node_modules/electron/dist
files:
  - out/**
  - package.json
  - resources/icon.png
asarUnpack:
  - node_modules/pdfjs-dist/**
  - node_modules/@napi-rs/canvas/**
  - node_modules/@napi-rs/canvas-*/**
extraResources:
  - from: resources/office-sandbox
    to: office-sandbox
win:
  target:
    - nsis
  signAndEditExecutable: true
  icon: build/icon.ico
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  artifactName: HanChuang-setup-${version}.${ext}
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
publish: null
